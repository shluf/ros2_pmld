# =========================================
# STATIC HAND SIGNS (keypoint classifier)
# =========================================
hand_signs:
  0: "move_forward"     # Forward
  1: "hover"            # Stop
  2: "move_up"          # Up
  3: "land"             # Land
  4: "move_down"        # Down
  5: "move_backward"    # Back
  6: "move_left"        # Left
  7: "move_right"       # Right

# =========================================
# DYNAMIC FINGER GESTURES (point history)
# =========================================
finger_gestures:
  0: "hover"            # Stop
  1: "flip"             # Clockwise gesture
  2: "rotate_ccw"       # Counter clockwise
  3: "move"             # Move with hand position

# =========================================
# VELOCITY
# =========================================
velocity_settings:
  linear_speed: 0.5
  angular_speed: 0.5
  vertical_speed: 0.3

  slow_mode_factor: 0.5
  fast_mode_factor: 1.5

# =========================================
# SAFETY
# =========================================
safety:
  enable_confirmation: true
  gesture_hold_time: 0.5
  no_gesture_timeout: 0.5
  emergency_priority: true

  gesture_specific_hold_times:
    takeoff: 0.5
    land: 0.5
    emergency: 0.3
    flip: 0.0

# =========================================
# POSITION MAPPING
# =========================================
position_mapping:
  enabled: true
  deadzone: 0.2

  zones:
    center:
      x_range: [0.4, 0.6]
      y_range: [0.4, 0.6]
      action: "hover"

    left:
      x_range: [0.0, 0.4]
      action: "move_left"

    right:
      x_range: [0.6, 1.0]
      action: "move_right"

    up:
      y_range: [0.0, 0.4]
      action: "move_up"

    down:
      y_range: [0.6, 1.0]
      action: "move_down"

# =========================================
# ADVANCED
# =========================================
advanced:
  sequences:
    enabled: false
    timeout: 3.0
    defined_sequences:
      - gestures: [0, 1, 2]
        action: "auto_land"
      - gestures: [4, 1, 1]
        action: "circle_pattern"

  modifiers:
    enabled: false
    two_hand_mode: false
    left_hand_function: "speed_control"
    right_hand_function: "direction_control"

# =========================================
# LOGGING
# =========================================
logging:
  log_gestures: true
  log_commands: true
  log_level: "INFO"

  save_data:
    enabled: false
    directory: "gesture_logs"
    format: "csv"

# =========================================
# CAMERA SETTINGS
# =========================================
camera:
  device_id: 0
  width: 960
  height: 540
  fps: 30

  mediapipe:
    static_image_mode: false
    max_num_hands: 1
    min_detection_confidence: 0.7
    min_tracking_confidence: 0.5

# =========================================
# MODEL SETTINGS
# =========================================
model:
  keypoint_classifier:
    path: "model/keypoint_classifier/keypoint_classifier.tflite"
    labels: "model/keypoint_classifier/keypoint_classifier_label.csv"

  point_history_classifier:
    path: "model/point_history_classifier/point_history_classifier.tflite"
    labels: "model/point_history_classifier/point_history_classifier_label.csv"
    history_length: 16

# =========================================
# ROS2 SETTINGS
# =========================================
ros2:
  namespace: ""

  topics:
    cmd_vel: "/cmd_vel"
    tello_action: "/tello_action"
    flight_data: "/flight_data"
    gesture_status: "/gesture_recognition/detected_gesture"
    safety_status: "/gesture_recognition/safety_status"

  qos:
    reliability: "reliable"
    history: "keep_last"
    depth: 10

# =========================================
# TESTING
# =========================================
testing:
  simulation_mode: false
  verbose_output: true
  show_camera_feed: true

  test_mode:
    enabled: false
    record_gestures: true
    playback_mode: false
